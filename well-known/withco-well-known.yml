notes: >-
  The original with.co domain 301-redirects to with.us (company rebranded from
  Withco to With). with.us is a client-rendered SPA behind Cloudflare whose
  origin catch-all returns HTTP 200 with the HTML app shell for every unknown
  path, so 200 responses on /.well-known/ paths are soft 404s (content-type
  text/html, no actual document) and were not saved as documents. The one real
  machine-readable surface is /robots.txt, which carries a Cloudflare Managed
  Content Signals block (search=yes, ai-train=no, use=reference) plus explicit
  Disallow rules for AI crawlers (Amazonbot, Applebot-Extended, Bytespider,
  CCBot, ClaudeBot, Google-Extended, GPTBot, meta-externalagent); the origin
  appends its SPA HTML shell after the managed block, and the file is saved
  verbatim as fetched.
