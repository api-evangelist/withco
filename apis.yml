name: Withco
description: Withco, now operating as With at with.us (the original with.co domain 301-redirects
  there), is rebuilding main street one share at a time. The company helps small business owners
  buy the commercial buildings they operate in, stacking the owner's investment, seller financing,
  and community investor capital to meet the deal price, grounding offers in comparable sales,
  and giving each business a public investor page to tell its story to potential backers. Withco
  is a consumer/community real-estate platform and publishes no public developer API surface.
